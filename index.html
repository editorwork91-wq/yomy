<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="/YOMY-LOGO.jpeg" />
    <link rel="apple-touch-icon" href="/YOMY-LOGO.jpeg" />
    <link rel="stylesheet" href="./yomy-compat.css" />
    <meta name="theme-color" content="#050507" />
    <meta name="color-scheme" content="dark" />
    <meta property="og:title" content="Yomy" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/YOMY-LOGO.jpeg" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Yomy" />
    <meta name="twitter:image" content="/YOMY-LOGO.jpeg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Yomy</title>

    <script>
      (function () {
        try {
          var root = document.documentElement;

          /* Adaptive geometry is driven from the visual viewport, not a
             hard-coded device size. The existing rem-based YOMY UI therefore
             scales naturally across small phones, large phones, tablets,
             split-screen and rotation. */
          var updateViewport = function () {
            try {
              var vv = window.visualViewport;
              var width = Math.max(1, Math.round((vv && vv.width) || window.innerWidth || 390));
              var height = Math.max(1, Math.round((vv && vv.height) || window.innerHeight || 844));
              var scale = width / 390;
              if (scale < 0.82) scale = 0.82;
              if (scale > 1.12) scale = 1.12;
              root.style.setProperty("--yomy-ui-scale", String(scale));
              root.style.setProperty("--yomy-vw", width + "px");
              root.style.setProperty("--yomy-vh", height + "px");
            } catch (_) {}
          };
          updateViewport();
          window.addEventListener("resize", updateViewport, false);
          window.addEventListener("orientationchange", updateViewport, false);
          if (window.visualViewport) {
            window.visualViewport.addEventListener("resize", updateViewport, false);
          }
          var css = window.CSS;
          var supports = css && typeof css.supports === "function";
          var modern =
            supports &&
            css.supports("display", "grid") &&
            css.supports("color", "color-mix(in srgb, black 50%, white)") &&
            css.supports("color", "oklch(0.5 0 0)");
          var ua = navigator.userAgent || "";
          var android = /Android/i.test(ua);
          var huawei = /Huawei|HUAWEI/i.test(ua);
          var oldAndroid = android && /Android\s(?:[4-9]|10)/i.test(ua);
          var legacy = !modern || oldAndroid || huawei;
          root.classList.add(legacy ? "yomy-webview-legacy" : "yomy-webview-modern");
          root.setAttribute("data-yomy-renderer", legacy ? "legacy" : "modern");
          window.__YOMY_RENDER_DIAGNOSTICS__ = {
            legacy: legacy,
            modernCss: !!modern,
            android: android,
            huawei: huawei,
            userAgent: ua
          };
        } catch (error) {
          document.documentElement.classList.add("yomy-webview-legacy");
          document.documentElement.setAttribute("data-yomy-renderer", "legacy");
          window.__YOMY_RENDER_DIAGNOSTICS__ = {
            legacy: true,
            modernCss: false,
            error: String(error)
          };
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
