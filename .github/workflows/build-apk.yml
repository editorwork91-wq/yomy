name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies & Capacitor Android
        run: |
          npm install
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Build web app
        env:
          VITE_VAPID_PUBLIC_KEY: ${{ secrets.VITE_VAPID_PUBLIC_KEY || secrets.VAPID_PUBLIC_KEY }}
        run: npm run build

      - name: Save repository native Android configuration
        run: |
          cp android/app/src/main/java/com/yomy/app/MainActivity.java /tmp/YomyMainActivity.java
          if [ -f android/app/google-services.json ]; then
            cp android/app/google-services.json /tmp/YomyGoogleServices.json
          fi
          rm -rf /tmp/YomyLauncherResources
          mkdir -p /tmp/YomyLauncherResources
          find android/app/src/main/res -type f -name 'ic_launcher*' -print0 | while IFS= read -r -d '' file; do
            rel="${file#android/app/src/main/res/}"
            mkdir -p "/tmp/YomyLauncherResources/$(dirname "$rel")"
            cp "$file" "/tmp/YomyLauncherResources/$rel"
          done

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Generate Android Platform
        run: |
          rm -rf android
          npx cap add android
          npx cap sync android

      - name: Restore Firebase Android configuration
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > android/app/google-services.json
          elif [ -f /tmp/YomyGoogleServices.json ]; then
            cp /tmp/YomyGoogleServices.json android/app/google-services.json
          elif [ -f google-services.json ]; then
            cp google-services.json android/app/google-services.json
          else
            echo "Firebase Android configuration is unavailable; native FCM registration will not produce a device token."
          fi

      - name: Restore launcher branding and native bridge
        run: |
          if [ -d /tmp/YomyLauncherResources ]; then
            cp -a /tmp/YomyLauncherResources/. android/app/src/main/res/
          fi
          python3 - <<'PY'
          from pathlib import Path
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          s = manifest.read_text()
          if 'xmlns:tools=' in s:
              s = s.replace(' xmlns:tools="http://schemas.android.com/tools"', '')
          marker = '    <uses-permission android:name="android.permission.INTERNET" />'
          additions = '''\n    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.VIBRATE" />\n    <uses-permission android:name="android.permission.WAKE_LOCK" />'''
          if 'android.permission.CAMERA' not in s:
              s = s.replace(marker, marker + additions)
          elif 'android.permission.MODIFY_AUDIO_SETTINGS' not in s:
              s = s.replace('    <uses-permission android:name="android.permission.RECORD_AUDIO" />', '    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />')
          if 'android.permission.VIBRATE' not in s:
              s = s.replace('</manifest>', '    <uses-permission android:name="android.permission.VIBRATE" />\n    <uses-permission android:name="android.permission.WAKE_LOCK" />\n</manifest>')
          # Keep Firebase's normal Android startup provider. It initializes the
          # FirebaseApp before Capacitor native push registration can run.
          s = s.replace('''\n        <provider\n            android:name="com.google.firebase.provider.FirebaseInitProvider"\n            android:authorities="${applicationId}.firebaseinitprovider"\n            tools:node="remove" />\n''', '\n')
          manifest.write_text(s)
          Path('android/app/src/main/java/com/yomy/app/MainActivity.java').write_text(Path('/tmp/YomyMainActivity.java').read_text())
          PY

      - name: Build Debug APK
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: yomy-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
