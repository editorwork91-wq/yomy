name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master", "feat/android-incoming-call-ringing" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies & Capacitor Android
        run: |
          npm install
          npm install @capacitor/core @capacitor/cli @capacitor/android

      - name: Build web app
        env:
          VITE_VAPID_PUBLIC_KEY: ${{ secrets.VITE_VAPID_PUBLIC_KEY || secrets.VAPID_PUBLIC_KEY }}
        run: npm run build

      - name: Save repository native Android configuration
        run: |
          cp android/app/src/main/java/com/yomy/app/MainActivity.java /tmp/YomyMainActivity.java
          mkdir -p /tmp/YomyNativeJava
          for file in CallActionReceiver.java CallNotificationService.java YomyFirebaseMessagingService.java; do
            if [ -f "android/app/src/main/java/com/yomy/app/$file" ]; then
              cp "android/app/src/main/java/com/yomy/app/$file" "/tmp/YomyNativeJava/$file"
            fi
          done
          if [ -f android/app/google-services.json ]; then
            cp android/app/google-services.json /tmp/YomyGoogleServices.json
          fi
          rm -rf /tmp/YomyLauncherResources
          mkdir -p /tmp/YomyLauncherResources
          find android/app/src/main/res -type f -name 'ic_launcher*' -print0 | while IFS= read -r -d '' file; do
            rel="${file#android/app/src/main/res/}"
            mkdir -p "/tmp/YomyLauncherResources/$(dirname "$rel")"
            cp "$file" "/tmp/YomyLauncherResources/$rel"
          done

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Generate Android Platform
        run: |
          rm -rf android
          npx cap add android
          npx cap sync android

      - name: Restore Firebase Android configuration
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > android/app/google-services.json
          elif [ -f /tmp/YomyGoogleServices.json ]; then
            cp /tmp/YomyGoogleServices.json android/app/google-services.json
          elif [ -f google-services.json ]; then
            cp google-services.json android/app/google-services.json
          else
            echo "Firebase Android configuration is unavailable; native FCM registration will not produce a device token."
          fi

      - name: Restore launcher branding and native bridge
        run: |
          if [ -d /tmp/YomyLauncherResources ]; then
            cp -a /tmp/YomyLauncherResources/. android/app/src/main/res/
          fi
          for file in CallActionReceiver.java CallNotificationService.java YomyFirebaseMessagingService.java; do
            if [ -f "/tmp/YomyNativeJava/$file" ]; then
              cp "/tmp/YomyNativeJava/$file" "android/app/src/main/java/com/yomy/app/$file"
            fi
          done
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path('android/app/src/main/AndroidManifest.xml')
          s = manifest.read_text()
          if 'xmlns:tools=' in s:
              s = s.replace(' xmlns:tools="http://schemas.android.com/tools"', '')
          marker = '    <uses-permission android:name="android.permission.INTERNET" />'
          additions = '''\n    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n    <uses-permission android:name="android.permission.VIBRATE" />\n    <uses-permission android:name="android.permission.WAKE_LOCK" />\n    <uses-permission android:name="android.permission.USE_FULL_SCREEN_INTENT" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\n    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" />'''
          if 'android.permission.FOREGROUND_SERVICE_SPECIAL_USE' not in s:
              s = s.replace(marker, marker + additions)
          services = '''\n        <service\n            android:name=".CallNotificationService"\n            android:exported="false"\n            android:stopWithTask="false"\n            android:foregroundServiceType="specialUse">\n            <property\n                android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE"\n                android:value="time-sensitive incoming call ringing and user call action handling" />\n        </service>\n\n        <service\n            android:name=".YomyFirebaseMessagingService"\n            android:exported="false">\n            <intent-filter>\n                <action android:name="com.google.firebase.MESSAGING_EVENT" />\n            </intent-filter>\n        </service>\n\n        <receiver\n            android:name=".CallActionReceiver"\n            android:exported="false" />\n'''
          if '.CallNotificationService' not in s:
              s = s.replace('    </application>', services + '    </application>')

          build = Path('android/app/build.gradle')
          bs = build.read_text()
          if 'firebase-messaging' not in bs:
              needle = "    implementation project(':capacitor-android')"
              addition = "    implementation project(':capacitor-android')\n    implementation platform('com.google.firebase:firebase-bom:34.18.0')\n    implementation 'com.google.firebase:firebase-messaging'"
              if needle in bs:
                  bs = bs.replace(needle, addition, 1)
              else:
                  raise SystemExit('Unable to locate Capacitor dependency anchor in android/app/build.gradle')
              build.write_text(bs)

          main = Path('android/app/src/main/java/com/yomy/app/MainActivity.java')
          ms = main.read_text()

          # The full-screen behavior is owned by the native call notification
          # service. Do not mutate MainActivity just to make CI survive source
          # formatting differences between Capacitor generations.
          old_js = 'window.location.assign(" + safeDestination + ");'
          new_js = 'window.history.pushState({}, \'\', " + safeDestination + "); window.dispatchEvent(new PopStateEvent(\'popstate\'));'
          if old_js in ms:
              ms = ms.replace(old_js, new_js, 1)
          main.write_text(ms)
          manifest.write_text(s)
          PY

      - name: Apply official Yomy launcher icon
        run: |
          # Use the public canonical YOMY-LOGO.jpeg for all Android launcher
          # variants so the external icon matches the web/PWA branding exactly.
          rm -f android/app/src/main/res/drawable/ic_launcher_background.xml
          for dir in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
            mkdir -p "android/app/src/main/res/$dir"
            rm -f "android/app/src/main/res/$dir/ic_launcher.png" "android/app/src/main/res/$dir/ic_launcher_round.png"
            cp public/YOMY-LOGO.jpeg "android/app/src/main/res/$dir/ic_launcher.jpg"
            cp public/YOMY-LOGO.jpeg "android/app/src/main/res/$dir/ic_launcher_round.jpg"
          done

      - name: Build Debug APK
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: yomy-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
