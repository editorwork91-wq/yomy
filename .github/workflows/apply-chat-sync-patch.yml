name: Yomy chat sync repair

on:
  push:
    branches:
      - feat/android-incoming-call-ringing

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/android-incoming-call-ringing
          fetch-depth: 1
      - name: Apply patch
        run: python3 scripts/patch_chat_sync.py
      - name: Commit patch when needed
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/Chat.tsx src/pages/Notifications.tsx
          if git diff --cached --quiet; then
            echo "No chat sync changes needed"
            exit 0
          fi
          git commit -m "fix: apply chat sync repair"
          git push origin HEAD:feat/android-incoming-call-ringing
