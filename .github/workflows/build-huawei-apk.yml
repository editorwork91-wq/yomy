name: Build YOMY Huawei APK

on:
  workflow_dispatch:
  push:
    branches: ["huawei-compat-2026-09-25"]

permissions:
  contents: read

jobs:
  build-huawei:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Huawei branch
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build web app for Huawei
        env:
          VITE_HUAWEI_BUILD: "true"
          VITE_VAPID_PUBLIC_KEY: ${{ secrets.VITE_VAPID_PUBLIC_KEY || secrets.VAPID_PUBLIC_KEY }}
        run: npm run build

      - name: Verify fresh web assets are present
        run: |
          test -f dist/index.html
          find dist/assets -maxdepth 1 -type f | grep -Eq '\\.(js|css)
          grep -R -q "bg-background" dist/assets/*.css

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Stage YOMY native call bridge before regeneration
        run: |
          rm -rf /tmp/yomy-native
          mkdir -p /tmp/yomy-native
          for file in MainActivity.java CallActionReceiver.java CallNotificationService.java IncomingCallActivity.java; do
            cp "android/app/src/main/java/com/yomy/app/$file" "/tmp/yomy-native/$file"
          done

      - name: Generate a clean Capacitor Android project
        run: |
          rm -rf android
          npx cap add android
          npx cap sync android

      - name: Restore YOMY native call bridge
        run: |
          for file in MainActivity.java CallActionReceiver.java CallNotificationService.java IncomingCallActivity.java; do
            cp "/tmp/yomy-native/$file" "android/app/src/main/java/com/yomy/app/$file"
          done

      - name: Apply Huawei WebView and notification-safe manifest
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          s = manifest.read_text()

          if 'xmlns:tools=' not in s:
              s = s.replace(
                  '<manifest xmlns:android="http://schemas.android.com/apk/res/android">',
                  '<manifest xmlns:android="http://schemas.android.com/apk/res/android" xmlns:tools="http://schemas.android.com/tools">',
                  1
              )

          if 'android.permission.POST_NOTIFICATIONS' not in s:
              s = s.replace(
                  '    <uses-permission android:name="android.permission.INTERNET" />',
                  '    <uses-permission android:name="android.permission.INTERNET" />\n'
                  '    <uses-permission android:name="android.permission.CAMERA" />\n'
                  '    <uses-permission android:name="android.permission.RECORD_AUDIO" />\n'
                  '    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n'
                  '    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />\n'
                  '    <uses-permission android:name="android.permission.VIBRATE" />\n'
                  '    <uses-permission android:name="android.permission.WAKE_LOCK" />\n'
                  '    <uses-permission android:name="android.permission.USE_FULL_SCREEN_INTENT" />\n'
                  '    <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />\n'
                  '    <uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" />',
                  1
              )

          services = '''
          <service
              android:name=".CallNotificationService"
              android:exported="false"
              android:stopWithTask="false"
              android:foregroundServiceType="specialUse">
              <property
                  android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE"
                  android:value="time-sensitive incoming call ringing and user call action handling" />
          </service>

          <receiver
              android:name=".CallActionReceiver"
              android:exported="false" />

          <activity
              android:name=".IncomingCallActivity"
              android:exported="false"
              android:excludeFromRecents="true"
              android:launchMode="singleTop"
              android:showWhenLocked="true"
              android:turnScreenOn="true"
              android:theme="@style/YomyIncomingCallTheme" />
          '''

          if '.CallNotificationService' not in s:
              s = s.replace('    </application>', services + '\n    </application>', 1)

          provider = '''
          <provider
              android:name="com.google.firebase.provider.FirebaseInitProvider"
              android:authorities="${applicationId}.firebaseinitprovider"
              tools:node="remove" />
          '''
          if 'com.google.firebase.provider.FirebaseInitProvider' not in s:
              app_open = s.index('    <application')
              app_end = s.index('>', app_open)
              s = s[:app_end+1] + provider + s[app_end+1:]

          s = re.sub(r'\s*<service\s+android:name="\.YomyFirebaseMessagingService".*?</service>\s*', '\n', s, flags=re.S)
          manifest.write_text(s)

          build = Path("android/app/build.gradle")
          bs = build.read_text()
          bs = bs.replace('versionCode 1', 'versionCode 2')
          bs = bs.replace('versionName "1.0"', 'versionName "1.0-huawei"')
          bs = bs.replace("    implementation platform('com.google.firebase:firebase-bom:34.18.0')\n", "")
          bs = bs.replace("    implementation 'com.google.firebase:firebase-messaging'\n", "")
          build.write_text(bs)

          values = Path("android/app/src/main/res/values")
          values.mkdir(parents=True, exist_ok=True)
          (values / "yomy_call_styles.xml").write_text("""<?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="YomyIncomingCallTheme" parent="@android:style/Theme.Material.NoActionBar">
                  <item name="android:windowNoTitle">true</item>
                  <item name="android:windowActionModeOverlay">true</item>
                  <item name="android:windowBackground">#081210</item>
                  <item name="android:colorAccent">#20B666</item>
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowDisablePreview">true</item>
                  <item name="android:windowIsTranslucent">false</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:windowLightNavigationBar">false</item>
              </style>
          </resources>
          """)
          PY

      - name: Apply YOMY launcher resources
        run: |
          rm -f android/app/src/main/res/drawable/ic_launcher_background.xml
          for dir in mipmap-mdpi mipmap-hdpi mipmap-xhdpi mipmap-xxhdpi mipmap-xxxhdpi; do
            mkdir -p "android/app/src/main/res/$dir"
            cp public/YOMY-LOGO.jpeg "android/app/src/main/res/$dir/ic_launcher.jpg"
            cp public/YOMY-LOGO.jpeg "android/app/src/main/res/$dir/ic_launcher_round.jpg"
          done

      - name: Build Huawei debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload Huawei APK
        uses: actions/upload-artifact@v4
        with:
          name: yomy-huawei-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

          grep -R -q "bg-background" dist/assets/*.css

