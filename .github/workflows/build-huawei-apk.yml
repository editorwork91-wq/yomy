name: Build Huawei no-Kit resident APK

on:
  push:
    branches:
      - huawei-no-kit-resident-20260926
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Remove Google push plugin for no-Kit build
        run: npm uninstall @capacitor/push-notifications --no-audit --no-fund

      - name: Build web app
        run: npm run build

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Preserve complete YOMY native Android layer
        run: |
          rm -rf /tmp/yomy-native-main
          mkdir -p /tmp/yomy-native-main
          cp -a android/app/src/main/. /tmp/yomy-native-main/

      - name: Generate clean Capacitor Android wrapper
        run: |
          rm -rf android
          npx cap add android
          npx cap sync android

      - name: Restore original YOMY Android resources and native sources
        run: |
          python3 - <<'PY'
          from pathlib import Path

          original = Path("/tmp/yomy-native-main/res")
          generated = Path("android/app/src/main/res")

          # Android resources are keyed by resource type + resource name, not file extension.
          # Remove only generated files that would collide with an original YOMY resource name.
          for src in original.rglob("*"):
              if not src.is_file():
                  continue
              rel_parent = src.parent.relative_to(original)
              dst_parent = generated / rel_parent
              dst_parent.mkdir(parents=True, exist_ok=True)
              for candidate in dst_parent.iterdir():
                  if candidate.is_file() and candidate.name != src.name and candidate.stem == src.stem:
                      candidate.unlink()

          import shutil
          shutil.copytree(original, generated, dirs_exist_ok=True)
          PY

          cp -a /tmp/yomy-native-main/java/. android/app/src/main/java/
          if [ -d /tmp/yomy-native-main/jniLibs ]; then
            mkdir -p android/app/src/main/jniLibs
            cp -a /tmp/yomy-native-main/jniLibs/. android/app/src/main/jniLibs/
          fi
          if [ -d /tmp/yomy-native-main/assets ]; then
            find /tmp/yomy-native-main/assets -mindepth 1 -maxdepth 1 ! -name public -exec cp -a {} android/app/src/main/assets/ \;
          fi
          cp /tmp/yomy-native-main/AndroidManifest.xml android/app/src/main/AndroidManifest.xml

          rm -f android/app/src/main/java/com/yomy/app/YomyFirebaseMessagingService.java
          rm -f android/app/src/main/java/com/yomy/app/YomyHuaweiMessagingService.java

      - name: Configure no-Kit Android build
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          app = Path('android/app/build.gradle')
          s = app.read_text()

          s = re.sub(
              r"\s*implementation platform\('com\.google\.firebase:firebase-bom:[^']+'\)\s*",
              "\n",
              s,
          )
          s = re.sub(
              r"\s*implementation ['\"]com\.google\.firebase:firebase-messaging['\"]\s*",
              "\n",
              s,
          )
          s = re.sub(
              r"\s*apply plugin: ['\"]com\.google\.gms\.google-services['\"]\s*",
              "\n",
              s,
          )
          s = re.sub(
              r"\ntry \{\s*def servicesJSON = file\('google-services\.json'\).*?\n\}\s*$",
              "\n",
              s,
              flags=re.S,
          )

          if 'com.squareup.okhttp3:okhttp:4.12.0' not in s:
              s = s.replace(
                  'dependencies {',
                  'dependencies {\n    implementation "com.squareup.okhttp3:okhttp:4.12.0"',
                  1,
              )

          app.write_text(s)

          manifest = Path('android/app/src/main/AndroidManifest.xml')
          ms = manifest.read_text()

          for perm in [
              'android.permission.RECEIVE_BOOT_COMPLETED',
              'android.permission.POST_NOTIFICATIONS',
              'android.permission.WAKE_LOCK',
              'android.permission.FOREGROUND_SERVICE',
              'android.permission.FOREGROUND_SERVICE_SPECIAL_USE',
          ]:
              tag = f'<uses-permission android:name="{perm}" />'
              if tag not in ms:
                  ms = ms.replace(
                      '    <uses-permission android:name="android.permission.INTERNET" />',
                      '    <uses-permission android:name="android.permission.INTERNET" />\n' + tag,
                      1,
                  )

          # Remove legacy Firebase provider/service if they are present in the preserved manifest.
          ms = re.sub(
              r'\n\s*<provider\s+android:name="com\.google\.firebase\.provider\.FirebaseInitProvider".*?</provider>\s*',
              '\n',
              ms,
              flags=re.S,
          )
          ms = re.sub(
              r'\n\s*<service\s+android:name="\.YomyFirebaseMessagingService".*?</service>\s*',
              '\n',
              ms,
              flags=re.S,
          )

          service = '''
          <service
              android:name=".YomyBackgroundService"
              android:enabled="true"
              android:exported="false"
              android:stopWithTask="false"
              android:foregroundServiceType="specialUse">
              <property
                  android:name="android.app.PROPERTY_SPECIAL_USE_FGS_SUBTYPE"
                  android:value="Yomy background realtime message and call connection" />
          </service>

          <receiver
              android:name=".YomyBootReceiver"
              android:enabled="true"
              android:exported="false">
              <intent-filter>
                  <action android:name="android.intent.action.BOOT_COMPLETED" />
                  <action android:name="android.intent.action.MY_PACKAGE_REPLACED" />
              </intent-filter>
          </receiver>
          '''

          if 'android:name=".YomyBackgroundService"' not in ms:
              ms = ms.replace('    </application>', service + '    </application>', 1)

          ms = ms.replace(
              '<uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" />',
              '<uses-permission android:name="android.permission.FOREGROUND_SERVICE_SPECIAL_USE" />',
              1,
          )

          manifest.write_text(ms)
          PY

      - name: Validate the no-Kit APK inputs
        run: |
          python3 - <<'PY'
          from pathlib import Path

          app = Path("android/app")
          forbidden = []
          for path in app.rglob("*"):
              if not path.is_file():
                  continue
              try:
                  text = path.read_text(errors="ignore")
              except Exception:
                  continue
              for needle in (
                  "com.google.firebase:firebase-messaging",
                  "com.huawei.hms",
                  "com.huawei.agconnect",
                  "@capacitor/push-notifications",
              ):
                  if needle in text:
                      forbidden.append((str(path), needle))

          if forbidden:
              print("Forbidden SDK references:")
              for item in forbidden:
                  print(" -", item[0], "=>", item[1])
              raise SystemExit(1)

          required = [
              app / "src/main/java/com/yomy/app/YomyBackgroundService.java",
              app / "src/main/java/com/yomy/app/YomyBootReceiver.java",
              app / "src/main/AndroidManifest.xml",
          ]
          for path in required:
              if not path.is_file():
                  print("Missing:", path)
                  raise SystemExit(1)

          manifest = (app / "src/main/AndroidManifest.xml").read_text(errors="ignore")
          required_manifest = (
              "android.permission.RECEIVE_BOOT_COMPLETED",
              'android:name=".YomyBootReceiver"',
              "android.intent.action.BOOT_COMPLETED",
              'android:name=".YomyBackgroundService"',
          )
          for needle in required_manifest:
              if needle not in manifest:
                  print("Missing manifest entry:", needle)
                  print(manifest)
                  raise SystemExit(1)

          print("No-Kit validation passed.")
          PY


      - name: Build Huawei no-Kit debug APK
        working-directory: ./android
        run: |
          chmod +x gradlew
          ./gradlew clean assembleDebug --stacktrace

      - name: Verify APK output
        run: |
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          ls -lh android/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Huawei no-Kit APK
        uses: actions/upload-artifact@v4
        with:
          name: yomy-huawei-no-kit-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
