name: Huawei CI validation

on:
  push:
    branches:
      - huawei-only-fix-20260926
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Remove Google FCM Capacitor plugin from Huawei validation build
        run: npm uninstall @capacitor/push-notifications --no-audit --no-fund

      - name: Build web application
        env:
          VITE_PUSH_FUNCTION: send-push-huawei
        run: npm run build

      - name: Verify Huawei source isolation
        run: |
          if grep -R "@capacitor/push-notifications" src android 2>/dev/null; then
            echo "Huawei branch still references the Google/Capacitor push plugin."
            exit 1
          fi
          if grep -R "firebase-messaging\|com.google.firebase:firebase-messaging" android 2>/dev/null; then
            echo "Huawei branch still contains an FCM native dependency."
            exit 1
          fi
          test -f supabase/functions/send-push-huawei/index.ts
          test -f android/app/src/main/java/com/yomy/app/YomyHuaweiMessagingService.java
          echo "Huawei isolation checks passed."
