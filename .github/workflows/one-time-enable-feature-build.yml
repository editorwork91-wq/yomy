name: One-time Enable Feature Build

on:
  push:
    branches: ["feat/pro-call-chat-lifecycle-2026-09-14"]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add feature branch to Android build trigger
        shell: python
        run: |
          from pathlib import Path
          p = Path('.github/workflows/build-apk.yml')
          s = p.read_text()
          old = 'branches: [ "main", "master", "feat/android-incoming-call-ringing" ]'
          new = 'branches: [ "main", "master", "feat/android-incoming-call-ringing", "feat/pro-call-chat-lifecycle-2026-09-14" ]'
          if old not in s:
              raise SystemExit('Android build branch trigger anchor not found')
          p.write_text(s.replace(old, new, 1))
      - name: Commit and remove one-time workflow
        shell: bash
        run: |
          git config user.name "yomy-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/build-apk.yml
          git rm .github/workflows/one-time-enable-feature-build.yml
          git commit -m "ci: build Android call hardening branch"
          git push origin HEAD:${GITHUB_REF_NAME}
